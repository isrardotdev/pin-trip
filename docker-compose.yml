# LOCAL DEVELOPMENT ONLY
# Production runs the Docker Hub image directly on the droplet via GitHub Actions CI/CD.
# See .github/workflows/deploy.yml

services:
  redis:
    image: redis:7-alpine
    container_name: wanderpin-redis
    restart: unless-stopped
    # Bind to localhost only — Docker bypasses UFW iptables rules,
    # so ports: "6379:6379" would expose Redis to the internet on a real server.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - wanderpin-redis-data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wanderpin-backend
    restart: unless-stopped
    # Override Redis URL to use Docker service name
    environment:
      - REDIS_URL=redis://redis:6379
      - YTDLP_PATH=/usr/local/bin/yt-dlp
    env_file:
      - ./apps/backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - redis
    volumes:
      # Hot-reload source without rebuilding image
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src
      # Temp dir for audio files
      - /tmp/wanderpin:/tmp/wanderpin

volumes:
  wanderpin-redis-data:

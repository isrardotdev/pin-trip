services:
  postgres:
    image: postgres:16-alpine
    container_name: pintrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pintrip_dev
    ports:
      - "5432:5432"
    volumes:
      - pintrip-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pintrip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pintrip-redis-data:/data

volumes:
  pintrip-postgres-data:
  pintrip-redis-data:

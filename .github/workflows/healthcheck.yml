name: Dependency Health Check

# Checks that every external service the reel-parsing pipeline depends on
# (Groq models, Gemini planner model, Nominatim, MapTiler, yt-dlp vs Instagram)
# is still working — catches model deprecations / API breakage before a user
# does. Posts to Discord only on failure. See apps/backend/src/scripts/dependencyHealthCheck.ts

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days, 06:00 UTC
  workflow_dispatch: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run health check
        working-directory: apps/backend
        run: pnpm healthcheck
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
